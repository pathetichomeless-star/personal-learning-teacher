services:
  xiaozhi-rtl-bridge:
    build: .
    container_name: xiaozhi-rtl-bridge
    restart: unless-stopped
    ports:
      - "8110:8110"
      - "8111:8111"
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - PUBLIC_WS_URL=ws://192.0.2.1:8110/xiaozhi/v1/
      - WS_PORT=8110
      - HTTP_PORT=8111
      - FRAME_MS=20
      # --- Qwen Realtime: REAL mode (R-1b cloud QA / human test). ---
      # Revert to mock for credential-free runs by setting QWEN_MODE=mock.
      # Endpoint is derived from the workspace id + cn-beijing (QWEN_WS_URL unset).
      - QWEN_MODE=real
      - QWEN_MODEL=qwen3.8-omni-flash-realtime
      - QWEN_VOICE=Tina
      - QWEN_SECRET_FILE=/app/secrets/qwen-realtime.env
      - QWEN_RECONNECT_MAX=5
      - QWEN_RECONNECT_BASE_MS=500
      - QWEN_STABLE_RESET_S=30
    volumes:
      - ./secrets/qwen-realtime.env:/app/secrets/qwen-realtime.env:ro